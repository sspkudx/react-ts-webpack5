packages:
    - 'apps/*'
    - 'packages/*'

# pnpm 11+ 配置统一迁移至本文件（.npmrc 仅保留 registry/auth）
shamefullyHoist: true
engineStrict: true

# pnpm 11 默认不执行依赖的构建脚本；esbuild（平台二进制）与
# @parcel/watcher（文件监听原生模块）为必要依赖，显式放行。
allowBuilds:
    esbuild: true
    '@parcel/watcher': true

catalogs:
    default:
        react: ^19.3.0
        react-dom: ^19.3.0
        # 构建链（与根 devDependencies 同版本）
        vite: ^8.3.0
        typescript: ^6.0.3
        '@vitejs/plugin-react': ^5.2.0

# 依赖更新策略：采用 pnpm 11 默认的 minimumReleaseAge=1440（新版本发布满 24h 后才被采纳），
# 避免激进更新刚发布的版本。
minimumReleaseAge: 1440
